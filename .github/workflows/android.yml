
name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair arquivos
        run: unzip -o InstaFollowers-projeto-Android.zip -d projeto

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle assembleDebug
        working-directory: projeto

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: InstaFollowers-APK
          path: projeto/app/build/outputs/apk/debug/*.apk
          
